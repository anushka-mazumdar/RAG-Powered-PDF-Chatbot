version: '3.8'

services:
  app:
    build: .
    container_name: rag-chatbot
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - LLM_MODEL=google/flan-t5-small
      - DEVICE=-1
      - MAX_CONTEXT_DOCS=3
      - MAX_NEW_TOKENS=256
      - TEMPERATURE=0.3
      - CHUNK_SIZE=900
      - CHUNK_OVERLAP=150
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_store:/app/chroma_store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
